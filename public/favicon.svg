<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 角丸スクエア背景 -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- 外枠アクセント -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 時計の外枠サークル -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- 時計の文字盤目盛り -->
  <circle cx="32" cy="17" r="1.5" fill="#38bdf8" />
  <circle cx="47" cy="32" r="1.5" fill="#38bdf8" />
  <circle cx="32" cy="47" r="1.5" fill="#38bdf8" />
  <circle cx="17" cy="32" r="1.5" fill="#38bdf8" />

  <!-- 時計の針（スマートな出退勤をイメージした9:15指針） -->
  <line x1="32" y1="32" x2="32" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="41" y2="32" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- 右下の成功・完了チェックバッジ -->
  <circle cx="46" cy="46" r="9" fill="#10b981" stroke="#0f172a" stroke-width="2" />
  <path d="M42.5 46 L45 48.5 L49.5 43.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>